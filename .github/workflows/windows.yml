# windows.yml — on every push: run all tests on Windows and build SANKET.exe.
# WHY: the app ships for Windows, so tests must pass there too (SAPI voices, DirectShow camera
#      backend, paths). The built folder is uploaded as an artifact Kanak can download and try.
name: windows-build
on:
  push:
    branches: [main, 'fix/**']
  workflow_dispatch:
env:
  PYTHONUTF8: "1"  # Windows runner ka cp1252 console Hindi/arrow print par crash karta tha
jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install Python 3.12 + deps
        run: uv sync --extra dev
      - name: Fetch frozen MediaPipe + Vosk models
        # ISL model Hugging Face par PRIVATE hai: HF_TOKEN secret ho to aata hai, warna DEMO build
        # (MediaPipe .task + Vosk phir bhi aate hain, taaki camera pipeline ka live test chal sake).
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        shell: pwsh
        run: |
          uv run python scripts/fetch_models.py
          if ($LASTEXITCODE -ne 0) { Write-Warning "ISL model nahi aaya (HF_TOKEN?) - DEMO build"; $global:LASTEXITCODE = 0 }
      - name: Lint
        run: uv run ruff check .
      - name: Tests (offscreen Qt)
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest -q
      - name: Build SANKET.exe
        run: uv run --with pyinstaller pyinstaller packaging/sanket.spec --noconfirm --distpath dist --workpath build
      - name: Self-test of the built exe
        shell: pwsh
        run: |
          $p = Start-Process dist\SANKET\SANKET.exe -ArgumentList "--selftest" -Wait -PassThru -NoNewWindow
          Write-Host "self-test exit code $($p.ExitCode) (DEMO until trained models are committed)"
          Get-Content "$env:LOCALAPPDATA\SANKET\sanket.log"
      - uses: actions/upload-artifact@v4
        with:
          name: SANKET-windows
          path: dist/SANKET
